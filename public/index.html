<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Outlook Directory Agent</title>
<style>
 body{font:14px system-ui,sans-serif;margin:0;background:#f4f5f7;color:#1b1f24}
 header{padding:12px 20px;background:#0f3d6e;color:#fff;display:flex;gap:16px;align-items:center}
 header span#st{margin-left:auto;padding:3px 10px;border-radius:12px;background:#a33}
 header span#st.ok{background:#2a7a3b}
 main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;padding:16px}
 @media(max-width:900px){main{grid-template-columns:1fr}}
 section{background:#fff;border-radius:8px;padding:14px;box-shadow:0 1px 3px #0002}
 h2{margin:0 0 10px;font-size:15px}
 #screen{width:100%;border:1px solid #ccd;cursor:crosshair;display:block;background:#eee;min-height:200px}
 input,button{font:inherit;padding:7px 10px}
 button{cursor:pointer}
 .row{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}.row input{flex:1;min-width:120px}
 #results div{padding:8px;border-bottom:1px solid #eee;cursor:pointer}
 #results div:hover{background:#eef4ff}
 pre{background:#10151c;color:#d6e2f0;padding:10px;border-radius:6px;overflow:auto;max-height:420px;margin:0}
 small{color:#667}
</style></head><body>
<header><b>Outlook Directory Agent</b><span id="st">not signed in</span></header>
<main>
 <section>
  <h2>1. Sign in (remote browser)</h2>
  <small>Click and type in the view below as you would in a normal browser: enter your email, password, MFA.</small>
  <div class="row">
   <button id="start">Start browser</button>
   <input id="text" placeholder="Type text here, then Send (for fields you've clicked)">
   <button id="send">Send</button>
   <button data-key="Enter">Enter</button><button data-key="Tab">Tab</button><button data-key="Backspace">⌫</button>
   <button id="logout">Reset session</button>
  </div>
  <img id="screen" alt="remote browser">
 </section>
 <section>
  <h2>2. Query the directory</h2>
  <div class="row"><input id="q" placeholder="Name or email"><button id="go">Search</button></div>
  <div id="results"></div>
  <h2 style="margin-top:14px">3. JSON for selected user</h2>
  <pre id="out">{}</pre>
 </section>
</main>
<script>
const $=s=>document.querySelector(s), post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});
const img=$('#screen'); let busy=false, on=false;
async function frame(){ if(!on||busy)return; busy=true;
  try{const r=await fetch('/api/screen?'+Date.now()); if(r.ok){const u=URL.createObjectURL(await r.blob()); const old=img.src; img.src=u; if(old.startsWith('blob:'))URL.revokeObjectURL(old);}}catch{}
  busy=false;}
setInterval(frame,700);
setInterval(async()=>{ if(!on)return; const s=await (await fetch('/api/status')).json(); $('#st').textContent=s.loggedIn?'signed in':'not signed in'; $('#st').className=s.loggedIn?'ok':''; },2000);
$('#start').onclick=async()=>{await post('/api/start'); on=true; frame();};
img.onclick=async e=>{const r=img.getBoundingClientRect(); await post('/api/click',{x:(e.clientX-r.left)*1280/r.width,y:(e.clientY-r.top)*800/r.height}); frame();};
img.addEventListener('wheel',e=>{e.preventDefault();post('/api/scroll',{dy:e.deltaY});},{passive:false});
$('#send').onclick=async()=>{await post('/api/type',{text:$('#text').value}); $('#text').value=''; frame();};
document.querySelectorAll('[data-key]').forEach(b=>b.onclick=async()=>{await post('/api/key',{key:b.dataset.key}); frame();});
$('#logout').onclick=async()=>{await post('/api/logout'); on=false; $('#st').textContent='not signed in'; $('#st').className='';};
async function search(){ $('#results').textContent='Searching…';
  const r=await fetch('/api/search?q='+encodeURIComponent($('#q').value)); const j=await r.json();
  if(!r.ok){$('#results').textContent=j.error;return;}
  $('#results').innerHTML=''; j.results.forEach(u=>{const d=document.createElement('div'); d.innerHTML=`<b></b> <small></small>`; d.firstChild.textContent=u.displayName; d.lastChild.textContent=[u.email,u.jobTitle].filter(Boolean).join(' · '); d.onclick=()=>pick(u); $('#results').append(d);});
  if(!j.count)$('#results').textContent='No results.'; }
async function pick(u){ $('#out').textContent='Loading…';
  const qs=u.email?'email='+encodeURIComponent(u.email):u.id?'id='+encodeURIComponent(u.id):'name='+encodeURIComponent(u.displayName);
  const r=await fetch('/api/user?raw=1&'+qs); $('#out').textContent=JSON.stringify(await r.json(),null,2); }
$('#go').onclick=search; $('#q').onkeydown=e=>{if(e.key==='Enter')search();};
</script></body></html>
